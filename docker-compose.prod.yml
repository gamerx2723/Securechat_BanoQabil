version: '3.8'

services:
  # ===================================================
  # 1. Managed PostgreSQL Database
  # ===================================================
  postgres:
    image: postgres:16-alpine
    container_name: securechat-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securechat_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_strong_password_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-securechat_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securechat_admin} -d ${POSTGRES_DB:-securechat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================================================
  # 2. Redis Cache & Session Store
  # ===================================================
  redis:
    image: redis:7-alpine
    container_name: securechat-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-securechat_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-securechat_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================================================
  # 3. Python AI Intelligence Microservice
  # ===================================================
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: securechat-ai-prod
    restart: always
    environment:
      PORT: 8000
      ENV: production

  # ===================================================
  # 4. Core Node.js / Express API & WebSocket Server
  # ===================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: securechat-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-securechat_admin}:${POSTGRES_PASSWORD:-change_this_strong_password_in_prod}@postgres:5432/${POSTGRES_DB:-securechat_db}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-securechat_redis_secret}@redis:6379"
      AI_SERVICE_URL: "http://ai-service:8000"
      JWT_SECRET: ${JWT_SECRET:-generate_a_secure_random_64_char_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-generate_another_secure_random_64_char_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.yourdomain.com}

  # ===================================================
  # 5. Production Web Client (SPA Nginx)
  # ===================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: securechat-web-prod
    restart: always
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api.yourdomain.com/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-wss://api.yourdomain.com}
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
